<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LateAlways</title>
  <link rel="icon" href="pfp.png">
  <meta property="og:title" content="LateAlways">
  <meta property="og:description" content="Developer. I reverse-engineer software and build it too.">
  <meta property="og:image" content="https://latealways.is-a.dev/pfp.png">
  <meta name="theme-color" content="#00ff80">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080808;
      --surface:      #101010;
      --surface-2:    #161616;
      --accent:       #00ff80;
      --accent-dim:   rgba(0, 255, 128, 0.07);
      --text:         #efefef;
      --muted:        rgba(239, 239, 239, 0.35);
      --border:       rgba(255, 255, 255, 0.06);
      --border-hover: rgba(0, 255, 128, 0.25);
    }

    html { scroll-behavior: smooth; }

    * { cursor: none !important; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Dot grid ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Accent glow behind hero ── */
    body::after {
      content: '';
      position: fixed;
      top: -120px; left: -80px;
      width: 600px; height: 500px;
      background: radial-gradient(ellipse, rgba(0,255,128,0.04) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    nav, .hero, .section, footer { position: relative; z-index: 1; }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, opacity 0.2s;
    }

    #cursor-ring {
      position: fixed;
      width: 26px; height: 26px;
      border: 1px solid rgba(0, 255, 128, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: rgba(8,8,8,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 16px; letter-spacing: -0.5px;
    }

    .nav-logo em { color: var(--accent); font-style: normal; }

    .nav-links { display: flex; gap: 28px; align-items: center; }

    .nav-links a { font-size: 12px; color: var(--muted); transition: color 0.15s; }
    .nav-links a:hover { color: var(--text); }

    /* ── Hero ── */
    .hero {
      max-width: 900px; margin: 0 auto;
      padding: 80px 48px 60px;
      animation: fadeUp 0.6s ease both;
    }

    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(0,255,128,0.15);
      border-radius: 100px; padding: 5px 14px;
      margin-bottom: 36px;
    }

    .status-badge::before {
      content: ''; width: 6px; height: 6px;
      background: var(--accent); border-radius: 50%;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.7); }
    }

    .pfp-wrap {
      width: 68px; height: 68px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent), transparent);
      margin-bottom: 28px;
    }

    .pfp {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid var(--bg);
    }

    /* Split outlined/filled title */
    .hero-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(56px, 10vw, 96px);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -4px;
      margin-bottom: 28px;
      display: block;
    }

    .hero-name .outline {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(239,239,239,0.2);
    }

    .hero-name .solid {
      display: block;
      color: var(--text);
    }

    .hero-name .dot { color: var(--accent); }

    .hero-desc {
      font-size: 13px; color: var(--muted);
      line-height: 2; max-width: 420px;
      margin-bottom: 40px;
    }

    /* Pills */
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 16px; font-size: 12px; color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }

    .pill:hover { border-color: var(--border-hover); color: var(--text); }

    .pill-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }

    /* ── Section ── */
    .section {
      max-width: 900px; margin: 0 auto;
      padding: 0 48px 90px;
    }

    .section-head {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 28px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .section-head h2 {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 700;
    }

    #repo-count { font-size: 12px; color: var(--muted); }

    /* ── Repo grid ── */
    #repos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
      animation: fadeUp 0.6s 0.18s ease both;
    }

    /* Spotlight card */
    .repo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 22px;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      opacity: 0; transform: translateY(10px);
    }

    .repo-card.visible {
      opacity: 1; transform: translateY(0);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, box-shadow 0.2s;
    }

    /* Spotlight layer */
    .repo-card::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(
        280px circle at var(--mx, -200px) var(--my, -200px),
        rgba(0,255,128,0.07),
        transparent 70%
      );
      pointer-events: none;
      border-radius: inherit;
    }

    .repo-card:hover {
      border-color: rgba(0,255,128,0.18);
      box-shadow: 0 0 0 1px rgba(0,255,128,0.06), 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(-3px);
    }

    .repo-name {
      font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700;
      transition: color 0.15s; position: relative; z-index: 1;
    }

    .repo-card:hover .repo-name { color: var(--accent); }

    .repo-desc {
      font-size: 11px; color: var(--muted);
      line-height: 1.75; flex: 1;
      position: relative; z-index: 1;
    }

    .repo-meta {
      display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-top: 4px;
      position: relative; z-index: 1;
    }

    .lang-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
    }

    .lang-tag::before {
      content: ''; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent); flex-shrink: 0;
    }

    .lang-python::before     { background: #4584b6; }
    .lang-javascript::before { background: #f0db4f; }
    .lang-typescript::before { background: #3178c6; }
    .lang-rust::before       { background: #ce412b; }
    .lang-go::before         { background: #00acd7; }
    .lang-csharp::before     { background: #68217a; }
    .lang-cpp::before        { background: #f34b7d; }
    .lang-c::before          { background: #555; }
    .lang-html::before       { background: #e34c26; }
    .lang-css::before        { background: #6757d3; }
    .lang-shell::before      { background: #89e051; }
    .lang-lua::before        { background: #6060b0; }

    .star-count {
      font-size: 11px; color: var(--muted);
    }

    .pushed-ago { font-size: 10px; color: var(--muted); margin-left: auto; opacity: 0.6; }

    /* ── Skeletons ── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 22px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .skel {
      height: 10px; border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--surface-2) 25%,
        rgba(255,255,255,0.035) 50%,
        var(--surface-2) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.7s infinite linear;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 22px 48px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--muted);
    }

    footer a:hover { color: var(--text); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 580px) {
      * { cursor: auto !important; }
      #cursor, #cursor-ring { display: none; }
      nav, .hero, .section, footer { padding-left: 20px; padding-right: 20px; }
      .hero-name { letter-spacing: -2px; }
    }
  </style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav>
  <span class="nav-logo">late<em>always</em></span>
  <div class="nav-links">
    <a href="#projects">projects</a>
    <a href="https://github.com/latealways" target="_blank" rel="noopener">github ↗</a>
  </div>
</nav>

<section class="hero">
  <div class="pfp-wrap">
    <img src="/pfp.png" alt="LateAlways" class="pfp" />
  </div>
  <span class="hero-name">
    <span class="outline">LATE</span>
    <span class="solid">ALWAYS<span class="dot">.</span></span>
  </span>
  <p class="hero-desc">
    Developer. I reverse-engineer software<br>and build it too. Mostly Python, but I get around.
  </p>
  <div class="pills">
    <a href="https://discord.com/users/705484710679150695" target="_blank" rel="noopener" class="pill"><span class="pill-dot"></span>Discord: LateAlways</a>
    <a href="mailto:contact@latealways.dev" class="pill">
      <span class="pill-dot"></span>contact@latealways.dev
    </a>
    <a href="https://github.com/latealways" target="_blank" rel="noopener" class="pill">
      <span class="pill-dot"></span>GitHub ↗
    </a>
    <a href="https://github.com/sponsors/latealways" target="_blank" rel="noopener" class="pill pill-sponsor">
      <span class="pill-dot" style="background:#db61a2"></span>Sponsor ♥
    </a>
    <a href="https://buymeacoffee.com/latealways" target="_blank" rel="noopener" class="pill pill-coffee">
      <span class="pill-dot" style="background:#ffdd00"></span>Buy me a coffee ☕
    </a>
  </div>
</section>

<section class="section" id="projects">
  <div class="section-head">
    <h2>projects</h2>
    <span id="repo-count">loading…</span>
  </div>
  <div id="repos">
    <div class="skeleton"><div class="skel" style="width:50%"></div><div class="skel" style="width:82%"></div><div class="skel" style="width:36%"></div></div>
    <div class="skeleton"><div class="skel" style="width:62%"></div><div class="skel" style="width:74%"></div><div class="skel" style="width:42%"></div></div>
    <div class="skeleton"><div class="skel" style="width:44%"></div><div class="skel" style="width:88%"></div><div class="skel" style="width:50%"></div></div>
    <div class="skeleton"><div class="skel" style="width:55%"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:38%"></div></div>
    <div class="skeleton"><div class="skel" style="width:68%"></div><div class="skel" style="width:65%"></div><div class="skel" style="width:44%"></div></div>
    <div class="skeleton"><div class="skel" style="width:48%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:55%"></div></div>
  </div>
</section>

<footer>
  <span>LateAlways · <span id="year"></span></span>
  <a href="https://github.com/latealways" target="_blank" rel="noopener">github ↗</a>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // ── Custom cursor ──
  const cursorDot  = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursor-ring');
  let mx = -100, my = -100, rx = -100, ry = -100;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursorDot.style.left = mx + 'px';
    cursorDot.style.top  = my + 'px';
  });

  (function animRing() {
    rx += (mx - rx) * 0.13;
    ry += (my - ry) * 0.13;
    cursorRing.style.left = rx + 'px';
    cursorRing.style.top  = ry + 'px';
    requestAnimationFrame(animRing);
  })();

  // Scale cursor on hoverable elements
  document.querySelectorAll('a, button, .repo-card, .pill').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursorDot.style.width  = '12px';
      cursorDot.style.height = '12px';
      cursorDot.style.width   = '12px';
      cursorRing.style.width  = '40px';
      cursorRing.style.height = '40px';
      cursorRing.style.borderColor = 'rgba(0,255,128,0.6)';
    });
    el.addEventListener('mouseleave', () => {
      cursorDot.style.width  = '7px';
      cursorDot.style.height = '7px';
      cursorRing.style.width  = '26px';
      cursorRing.style.height = '26px';
      cursorRing.style.borderColor = 'rgba(0,255,128,0.35)';
    });
  });

  // ── Helpers ──
  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60)       return 'just now';
    if (s < 3600)     return Math.floor(s / 60) + 'm ago';
    if (s < 86400)    return Math.floor(s / 3600) + 'h ago';
    if (s < 2592000)  return Math.floor(s / 86400) + 'd ago';
    if (s < 31536000) return Math.floor(s / 2592000) + 'mo ago';
    return Math.floor(s / 31536000) + 'y ago';
  }

  function langKey(lang) {
    return lang ? 'lang-' + lang.toLowerCase().replace(/[^a-z]/g, '') : '';
  }

  // ── Spotlight on cards ──
  function attachSpotlight(card) {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  }

  // ── Scroll reveal ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });

  // ── Load repos ──
  async function loadRepos() {
    try {
      const res  = await fetch('https://api.github.com/users/latealways/repos?per_page=100');
      const data = await res.json();

      const repos = data
        .filter(r => !r.disabled && !r.fork)
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

      document.getElementById('repo-count').textContent = repos.length + ' repos';

      const container = document.getElementById('repos');
      container.innerHTML = '';

      repos.forEach((repo, i) => {
        const lang = repo.language || 'None';
        const card = document.createElement('div');
        card.className = 'repo-card';
        card.style.transitionDelay = Math.min(i * 35, 350) + 'ms';

        card.innerHTML = `
          <div class="repo-name">${repo.name}</div>
          <p class="repo-desc">${repo.description || 'No description.'}</p>
          <div class="repo-meta">
            <span class="lang-tag ${langKey(repo.language)}">${lang}</span>
            <span class="star-count">★ ${repo.stargazers_count}</span>
            <span class="pushed-ago">${timeAgo(repo.pushed_at)}</span>
          </div>`;

        card.addEventListener('click', () => window.open(repo.html_url, '_blank'));
        attachSpotlight(card);
        observer.observe(card);
        container.appendChild(card);
      });

      // Cursor scale for new cards
      document.querySelectorAll('.repo-card').forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursorDot.style.width  = '12px';
          cursorDot.style.height = '12px';
          cursorRing.style.width  = '40px';
          cursorRing.style.height = '40px';
          cursorRing.style.borderColor = 'rgba(0,255,128,0.6)';
        });
        el.addEventListener('mouseleave', () => {
          cursorDot.style.width  = '7px';
          cursorDot.style.height = '7px';
          cursorRing.style.width  = '26px';
          cursorRing.style.height = '26px';
          cursorRing.style.borderColor = 'rgba(0,255,128,0.35)';
        });
      });
    } catch (err) {
      document.getElementById('repo-count').textContent = '';
      document.getElementById('repos').innerHTML =
        '<p style="font-size:13px;color:var(--muted)">Could not load repositories.</p>';
    }
  }

  loadRepos();
</script>
</body>
</html>
