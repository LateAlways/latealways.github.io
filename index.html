<!DOCTYPE html>
<html>

<head>
  <meta name="google-adsense-account" content="ca-pub-8513436438765537">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://latealways.is-a.dev/pfp.png" rel="icon">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <meta content="LateAlways' Site" property="og:title" />
  <meta content="My portfolio" property="og:description" />
  <meta content="https://latealways.is-a.dev/pfp.png" property="og:image" />
  <meta content="#00ff80" data-react-helmet="true" name="theme-color" />
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>LateAlways - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: rgba(10, 10, 10, 255);
      color: white;
    }

    #main {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      margin-right: 20px;
      animation: fadeInAnimation ease 0.8s both;
    }

    .material-symbols-outlined {
      user-select: none;
      text-decoration: none;
      font-size: 25px;
      vertical-align: text-bottom;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }

    a {
      user-select: none;
      text-decoration: none;
      color: white;
    }

    a:hover {
      text-decoration: underline;
    }

    .widget {
      border-radius: 8px;
      background-color: rgba(30, 30, 30, 255);
      font-family: 'Montserrat', sans-serif;
      margin: 10px;
      width: 50%;
      padding: 10px;
      flex-grow: 1;
    }

    #page {
      user-select: none;
      opacity: 0;
      transition: opacity 0.1s;
      font-family: 'Montserrat', sans-serif;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #animateText {
      transition: opacity 0.1s;
    }

    #terminal {
      color: rgba(230, 230, 230, 255);
      font-family: Consolas, monaco, monospace;
      text-align: center;
    }

    #terminal::after {
      content: "_";
      animation: blink 1200ms linear infinite;
      margin-left: 1px;
    }

    .term {
      user-select: none;
    }

    .repo-card {
      background-color: rgba(20, 20, 20, 255);
      padding: 35px;
      width: 40%;
      max-width: 100%;
      cursor: pointer;
    }

    .repo-card:hover {
      background-color: rgba(35, 35, 35, 255);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { box-shadow: inset 0 0 5px grey; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: rgb(190, 190, 190); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #000; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="term" class="term">
    <span id="terminal"></span>
  </div>
  <div id="page">
    <h3 id="animateText">Hello, I am LateAlways!</h3>
  </div>
  <div id="main" style="display: none !important;">
    <div class="widget" style="padding-left: 35px;">
      <h3>
        <img style="border-radius: 50%; vertical-align: middle;" alt="profile picture" src="pfp.png" width="100" height="100">
        <span style="padding-left: 20px;">
          <a href="https://github.com/latealways">LateAlways</a>
          <br><br>
          <span style="color: rgba(150,150,150,255);">eeny, meeny, miny, moe</span> | Discord: LateAlways | <a href="https://github.com/latealways">GitHub</a>
        </span>
      </h3>
    </div>
    <div class="widget" style="max-width: 100%; width: 100%;">
      <h3 style="margin-left: 15px; line-height: 1px;">My projects:</h3>
      <div id="repos" style="display: flex; flex-wrap: wrap;"></div>
    </div>
  </div>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    const termEl      = document.getElementById("terminal");
    const pageEl      = document.getElementById("page");
    const animTextEl  = document.getElementById("animateText");
    const termWrap    = document.getElementById("term");
    const mainEl      = document.getElementById("main");

    const SPEED = 60; // ms per character

    function setTermPrompt(ip) {
      return `<span style="color:rgba(50,255,50,255);">${ip}@${location.hostname} ~ $</span>`;
    }

    // Types text one character at a time; resolves when done.
    function typeText(text) {
      return new Promise(resolve => {
        for (let i = 0; i < text.length; i++) {
          setTimeout(() => { termEl.innerHTML += text[i]; }, i * SPEED);
        }
        setTimeout(resolve, text.length * SPEED);
      });
    }

    // Instantly appends HTML (no typing animation).
    function append(html) {
      termEl.innerHTML += html;
    }

    // Fades #animateText out, swaps content, fades back in.
    async function swapText(html, displayMs = 2000) {
      animTextEl.style.opacity = "0";
      await sleep(130);
      animTextEl.innerHTML = html;
      animTextEl.style.opacity = "1";
      await sleep(displayMs);
    }

    // ── Repos ────────────────────────────────────────────────────────────────

    async function loadRepos() {
      try {
        const resp = await fetch("https://api.github.com/users/latealways/repos?per_page=100");
        const data = await resp.json();

        // Sort by most recently pushed, skip forks & disabled
        const repos = data
          .filter(r => !r.disabled && !r.fork)
          .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

        const container = document.getElementById("repos");

        for (const repo of repos) {
          const card = document.createElement("div");
          card.className = "widget repo-card";
          card.onclick = () => window.open(repo.homepage || repo.html_url, "_blank");
          card.innerHTML = `
            <h4><a href="${repo.homepage || repo.html_url}">${repo.full_name}</a></h4>
            <p>${repo.description || "No description."}</p>
            <h4 style="color:rgba(120,120,120,255);">
              ${repo.language || "None"} |
              <span style="color:white;">
                <span class="material-symbols-outlined">star</span>: ${repo.stargazers_count}
              </span>
            </h4>`;
          container.appendChild(card);
        }
      } catch (e) {
        console.error("Failed to load repos:", e);
      }
    }

    // ── Intro sequence ───────────────────────────────────────────────────────

    async function runIntro() {
      let ip = "visitor";
      let country = "";

      try {
        ip = await fetch("https://api.latealways.dev/getip").then(r => r.text());
      } catch (_) {}

      const prompt = () => setTermPrompt(ip);

      // Line 1: greeting
      append(prompt() + " ");
      await typeText(`Hello ${ip}! `);
      await sleep(750);

      // Line 2: country
      try {
        const geo = await fetch("https://api.latealways.dev/getcountry").then(r => r.json());
        country = geo.country_name;
      } catch (_) {}

      append(`<br>${prompt()} `);
      await typeText(`Looks like we have someone from ${country || "somewhere"}`);
      await typeText(", that's cool!");
      await sleep(750);

      // Line 3: intro
      append(`<br>${prompt()} `);
      await typeText("Let me introduce you to my website.");
      await sleep(500);

      // Line 4: run command
      append(`<br>${prompt()} `);
      await typeText("./latealways");
      append("<br> ");
      await sleep(2500);

      // Switch to animated text panel
      termWrap.style.opacity = "0";
      pageEl.style.opacity   = "1";

      // Cycle through descriptions
      await swapText("Hello, I am LateAlways!", 2000);
      await swapText("I am a developer.", 2500);
      await swapText("I like reverse-engineering software but also making it.", 2500);
      await swapText("I usually code in Python but I also use other programming languages.", 2500);
      await swapText("That's all for now.");

      // Load repos in parallel with the last text frame
      loadRepos();

      await sleep(2000);

      // Show main content
      mainEl.style.removeProperty("display");
      animTextEl.hidden = true;
      termWrap.hidden   = true;
      animTextEl.style.opacity = "0";
      pageEl.style.opacity     = "0";
    }

    document.addEventListener("DOMContentLoaded", runIntro);
  </script>
</body>

</html>
