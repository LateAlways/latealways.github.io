<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LateAlways — 400</title>
  <link rel="icon" href="/pfp.png">
  <meta name="theme-color" content="#00ff80">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --accent: #00ff80;
      --text: #efefef; --muted: rgba(239,239,239,0.35);
      --border: rgba(255,255,255,0.06);
    }
    * { cursor: none !important; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    /* dot grid */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
      background-size: 26px 26px; pointer-events: none; z-index: 0;
    }
    /* accent glow */
    body::after {
      content: ''; position: fixed;
      top: -150px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(0,255,128,0.05) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    /* cursor */
    #cursor {
      position: fixed; width: 7px; height: 7px;
      background: var(--accent); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .2s, height .2s;
    }
    #cursor-ring {
      position: fixed; width: 26px; height: 26px;
      border: 1px solid rgba(0,255,128,.35); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
    }
    .wrap {
      position: relative; z-index: 1;
      text-align: center; padding: 40px 24px;
      animation: fadeUp .6s ease both;
    }
    .code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800; line-height: 1;
      letter-spacing: -6px;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(239,239,239,0.18);
      display: block; margin-bottom: 4px;
    }
    .label {
      font-family: 'Syne', sans-serif;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 800; color: var(--text);
      letter-spacing: -1px; margin-bottom: 16px;
    }
    .label .dot { color: var(--accent); }
    .msg {
      font-size: 13px; color: var(--muted);
      line-height: 2; margin-bottom: 40px;
    }
    .home-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px; padding: 9px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted);
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }
    .home-btn:hover { border-color: rgba(0,255,128,.25); color: var(--text); }
    .home-btn::before {
      content: ''; width: 5px; height: 5px;
      background: var(--accent); border-radius: 50%;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      * { cursor: auto !important; }
      #cursor, #cursor-ring { display: none; }
    }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <div class="wrap">
    <span class="code">400</span>
    <div class="label">bad request<span class="dot">.</span></div>
    <p class="msg">you sent something i couldn't understand.</p>
    <a href="/" class="home-btn">go home</a>
  </div>
  <script>
    const dot  = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx=-100,my=-100,rx=-100,ry=-100;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      dot.style.left=mx+'px'; dot.style.top=my+'px';
    });
    (function tick() {
      rx+=(mx-rx)*.13; ry+=(my-ry)*.13;
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      requestAnimationFrame(tick);
    })();
    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter',()=>{ dot.style.width='12px';dot.style.height='12px';ring.style.width='38px';ring.style.height='38px';ring.style.borderColor='rgba(0,255,128,.6)'; });
      el.addEventListener('mouseleave',()=>{ dot.style.width='7px';dot.style.height='7px';ring.style.width='26px';ring.style.height='26px';ring.style.borderColor='rgba(0,255,128,.35)'; });
    });
  </script>
</body>
</html>
